  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:#EAEAEA;
    font-family:'Pretendard', -apple-system, sans-serif;
    color:var(--ink);
    padding:32px 24px 80px;
  }

  h1{
    font-size:22px;
    font-weight:600;
    text-align:center;
    margin:0 0 6px;
  }
  p.lead{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin:0 0 28px;
  }

  /* ---- tab nav ---- */
  .tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    max-width:1100px;
    margin:0 auto 36px;
  }
  .tabs button{
    border:1px solid #D6D6D6;
    background:#fff;
    color:#555;
    padding:9px 16px;
    border-radius:999px;
    font-family:inherit;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:all .15s ease;
    white-space:nowrap;
  }
  .tabs button:hover{ background:#f2f2f2; }
  .tabs button.active{
    background:var(--dark);
    color:#fff;
    border-color:var(--dark);
  }

  /* ---- stage / frame wrapper ---- */
  .stage{
    display:flex;
    justify-content:center;
  }
  .frame-wrap{
    display:none;
  }
  .frame-wrap.active{
    display:block;
  }
  .frame-shell{
    box-shadow:0 20px 60px rgba(0,0,0,0.18);
    border-radius:36px;
    overflow:hidden;
    border:1px solid #000;
  }
  .frame-shell.web{
    border-radius:14px;
  }

  /* ---- iPad screen (834 x 1194), shown at 45% scale ---- */
  .screen{
    position:relative;
    width:834px;
    height:1194px;
    background:var(--bg);
    transform:scale(0.46);
    transform-origin:top left;
  }
  .screen-scale-box{
    width:383px;
    height:549px;
    overflow:hidden;
  }

  .photo-box{
    position:absolute;
    width:735px;
    height:521px;
    left:calc(50% - 735px/2);
    top:336px;
    background-image:var(--family-photo);
    background-size:cover;
    background-position:center;
    border:2px solid var(--dark);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#B3B3B3;
    font-size:22px;
    font-weight:500;
  }

  .date-group{
    position:absolute;
    left:0; right:0;
    top:135px;
    text-align:center;
  }
  .date-main{
    font-size:40px;
    font-weight:600;
    line-height:48px;
    color:var(--ink);
    white-space:nowrap;
  }
  .date-lunar{
    font-size:30px;
    font-weight:500;
    line-height:36px;
    color:var(--sub);
    margin-top:6px;
    white-space:nowrap;
  }

  .headline{
    position:absolute;
    left:0; right:0;
    top:937px;
    text-align:center;
    font-size:40px;
    font-weight:400;
    line-height:48px;
    color:var(--ink);
  }
  .subline{
    position:absolute;
    left:0; right:0;
    top:1077px;
    text-align:center;
    font-size:30px;
    font-weight:300;
    line-height:36px;
    color:var(--ink);
  }

  .cta{
    position:absolute;
    left:calc(50% - 426px/2);
    top:991px;
    width:426px;
    height:80px;
    border-radius:40px;
    background:var(--dark);
    color:#fff;
    border:none;
    font-family:inherit;
    font-size:40px;
    font-weight:600;
    line-height:48px;
    cursor:pointer;
  }
  .cta.disabled{
    background:var(--disabled);
    cursor:default;
  }

  /* screen 6: notification-style layout */
  .note-title{
    position:absolute;
    left:0; right:0;
    top:974px;
    text-align:center;
    font-size:40px;
    font-weight:400;
    line-height:48px;
  }
  .note-sub{
    position:absolute;
    left:0; right:0;
    top:1033px;
    text-align:center;
    font-size:40px;
    font-weight:400;
    line-height:48px;
  }

  /* screen 9: status pill row */
  .status-row{
    position:absolute;
    left:0; right:0;
    top:1150px;
    display:flex;
    justify-content:center;
    gap:36px;
  }
  .status-item{
    font-size:34px;
    font-weight:600;
    color:#C4C4C4;
  }
  .status-item.on{ color:var(--ink); }

  /* ---- web dashboard (1920x1080), shown scaled ---- */
  .web-screen{
    position:relative;
    width:1920px;
    height:1080px;
    background:var(--bg);
    transform:scale(0.5);
    transform-origin:top left;
  }
  .web-scale-box{
    width:960px;
    height:540px;
    overflow:hidden;
  }
  .grid-card{
    position:absolute;
    width:303px;
    height:303px;
    background:#D9D9D9;
    border-radius:16px;
  }

  .caption{
    max-width:383px;
    margin:14px auto 0;
    text-align:center;
    font-size:13px;
    color:var(--sub);
  }
</style>

const tabsEl = document.getElementById('tabs');
const stageEl = document.getElementById('stage');

screens.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.textContent = s.label;
  btn.dataset.target = s.id;
  if (i === 0) btn.classList.add('active');
  btn.addEventListener('click', () => activate(s.id));
  tabsEl.appendChild(btn);

  const wrap = document.createElement('div');
  wrap.className = 'frame-wrap' + (i === 0 ? ' active' : '');
  wrap.id = 'wrap-' + s.id;

  if (s.type === 'ipad') {
    wrap.innerHTML = `
      <div class="frame-shell">
        <div class="screen-scale-box">
          <div class="screen">${s.body}</div>
        </div>
      </div>
      <div class="caption">${s.caption}</div>
    `;
  } else {
    let grid = '';
    const gapX = 359, gapY = 351, startX = 90, startY = 289;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 5; c++) {
        grid += `<div class="grid-card" style="left:${startX + c*gapX}px; top:${startY + r*gapY}px;"></div>`;
      }
    }
    wrap.innerHTML = `
      <div class="frame-shell web">
        <div class="web-scale-box">
          <div class="web-screen">${grid}</div>
        </div>
      </div>
      <div class="caption">${s.caption}</div>
    `;
  }

  stageEl.appendChild(wrap);
});

function activate(id) {
  document.querySelectorAll('.tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.target === id);
  });
  document.querySelectorAll('.frame-wrap').forEach(w => {
    w.classList.toggle('active', w.id === 'wrap-' + id);
  });
}
</script>
